<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kehadiran - [2572056]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"rel="stylesheet"/>
</head>
<style>
    .header-container {
        background-color: #007bff;
    }
    .custom-bg-card {
        background-color: #f8f9fa;
    }
    .detail-box {
        background-color: #e9ecef;
        border-radius: 10px;
        padding: 20px;
    }
    .detail-box-success {
        background-color: #198754;
        color: #ffffff;
        border-radius: 10px;
        padding: 20px;
    }
</style>
<body>
    <div class="container-fluid p-0 mb-4 header-container">
        <div class="text-white text-center py-4">
            <h1 class="fw-bold mb-0">Form Kehadiran</h1>
            <p class="mb-0">Angkatan XX</p>
        </div>
    </div>
    <div class="container pb-5">
        <div class="card mb-4 border-0 shadow-sm custom-bg-card">
            <div class="card-body p-4">
                <h5 class="card-title text-success fw-bold mb-4">Detail Acara</h5>
                <div class="row text-center g3">
                    <div class="col-md-4">
                        <div class="detail-box">
                            <p class="text-muted d-block">Lokasi</p>
                            <h3 class="d-block">ADV 4</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="detail-box">
                            <p class="text-muted d-block">Dresscode</p>
                            <h3 class="d-block">Sopan & Rapi</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="detail-box-success">
                            <p class="d-block">Waktu</p>
                            <h3 class="d-block">15:00 - 17:00</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm custom-bg-card">
                    <div class="card-body p-4">
                        <h5 class="card-title fw-bold mb-4">Konfirmasi Kehadiran</h5>
                        <form id="formKehadiran">
                            <div class="mb-3">
                                <label for="nama" class="form-label text-muted small mb-11">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan Nama" required>
                            </div>
                            <div class="mb-3">
                                <label for="NRP" class="form-label text-muted small mb-11">NRP</label>
                                <input type="text" class="form-control" id="NRP" placeholder="Masukkan NRP" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label text-muted small mb-11">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="nama@maranatha.ac.id" required>
                            </div>
                            <div class="mb-3">
                                <label for="telepon" class="form-label text-muted small mb-11">No Telepon</label>
                                <input type="text" class="form-control" id="telepon" placeholder="08xxxxxxxxxx" required>
                            </div>
                            <div class="mb-3">
                                <label for="jam" class="form-label text-muted small mb-11">Jam Kehadiran</label>
                                <input type="time" class="form-control" id="jam" placeholder="--.--" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Konfirmasi Kehadiran</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm custom-bg-card h-100">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title text-success fw-bold mb-0">Daftar Peserta</h5>
                            <span class="badge bg-primary px-3 py-2" id="totalPeserta">Total: 0</span>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-borderless align-middle mb-0">
                                <thead class="table-custom-header">
                                    <tr>
                                        <th class="py-2">Nama</th>
                                        <th class="py-2">NRP</th>
                                        <th class="py-2">Email</th>
                                        <th class="py-2">Telepon</th>
                                        <th class="py-2">Jam</th>
                                        <th class="py-2">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelPeserta">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    </div>
    <script>
        const STORAGE_KEY = "namaLocalStorage";

        function tambahPeserta(dataBaru) {
            let dataPeserta = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            dataPeserta.push(dataBaru);
            
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(dataPeserta)
            );
        }

        function hapusPeserta(index) {
            let dataPeserta = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            dataPeserta.splice(index, 1);
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataPeserta));
        }

        document.getElementById("formKehadiran").addEventListener("submit", function(e) {
            e.preventDefault();
            const dataBaru = {
                nama: document.getElementById("nama").value,
                nrp: document.getElementById("NRP").value,
                email: document.getElementById("email").value,
                telepon: document.getElementById("telepon").value,
                jam: document.getElementById("jam").value
            };
            tambahPeserta(dataBaru);
            this.reset();
            tampilkanPeserta();
        });

        function tampilkanPeserta() {
            const dataPeserta = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const tbody = document.getElementById("tabelPeserta");
            tbody.innerHTML = "";
            dataPeserta.forEach((peserta, index) => {
                const row = `<tr>
                    <td>${peserta.nama}</td>
                    <td>${peserta.nrp}</td>
                    <td>${peserta.email}</td>
                    <td>${peserta.telepon}</td>
                    <td>${peserta.jam}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="hapusPeserta(${index}); tampilkanPeserta();">Hapus</button></td>
                </tr>`;
                tbody.innerHTML += row;
            });
            document.getElementById("totalPeserta").textContent = `Total: ${dataPeserta.length}`;
        }

        tampilkanPeserta();
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
